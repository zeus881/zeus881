<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Featured projects: Retail ESL automation, AI client targeting, Cubboard4u.com, AI art generator.">
<defs>
